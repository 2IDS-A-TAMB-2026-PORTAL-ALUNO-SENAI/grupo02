<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Portal do Aluno SENAI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            transition: background 0.3s, color 0.3s;
        }

        /* BARRA DE ACESSIBILIDADE */
        .acessibilidade-barra {
            background: #333;
            padding: 5px 20px;
            text-align: right;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .btn-acessibilidade, .btn-tema {
            background: #444;
            color: white;
            border: 1px solid #555;
            padding: 5px 12px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
        }

        .btn-acessibilidade:hover, .btn-tema:hover {
            background: #555;
        }

        /* ESTILOS PADRÃO */
        .navbar {
            background: #195da8;
            padding: 15px 40px;
        }

        .navbar-brand {
            color: white !important;
            font-weight: bold;
        }

        .contato-banner {
            background: #195da8;
            color: white;
            text-align: center;
            padding: 60px 20px;
        }

        .contato-container {
            max-width: 1100px;
            margin: 50px auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            padding: 20px;
        }

        .info-contato, .formulario {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,.1);
        }

        .formulario h2, .info-contato h2 {
            color: #195da8;
            margin-bottom: 20px;
        }

        .btn-enviar {
            background: #195da8;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            width: 100%;
        }

        .btn-enviar:hover {
            background: #144b86;
        }

        footer {
            background: #195da8;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 40px;
        }

        /* RESPONSIVIDADE */
        @media(max-width:768px){
            .contato-container {
                grid-template-columns: 1fr;
            }
        }

        /* --- REGRAS DE ALTO CONTRASTE --- */
        body.alto-contraste {
            background: #000000 !important;
            color: #ffffff !important;
        }

        body.alto-contraste .navbar,
        body.alto-contraste .contato-banner,
        body.alto-contraste footer {
            background: #1a1a1a !important;
            border-bottom: 2px solid #fff;
        }

        body.alto-contraste .info-contato,
        body.alto-contraste .formulario {
            background: #111111 !important;
            color: #ffffff !important;
            border: 2px solid #ffffff;
            box-shadow: none;
        }

        body.alto-contraste .formulario h2,
        body.alto-contraste .info-contato h2,
        body.alto-contraste .navbar-brand {
            color: #ffff00 !important; /* Texto em amarelo para alto destaque */
        }

        body.alto-contraste .form-control {
            background: #222 !important;
            color: #fff !important;
            border: 1px solid #fff;
        }

        body.alto-contraste .btn-enviar {
            background: #ffff00 !important;
            color: #000 !important;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="acessibilidade-barra">
        <button id="aumentar" class="btn-acessibilidade" title="Aumentar Fonte">A+</button>
        <button id="diminuir" class="btn-acessibilidade" title="Diminuir Fonte">A-</button>
        <button id="contraste" class="btn-tema" title="Alternar Contraste">☀️</button>
    </div>

    <nav class="navbar">
        <a class="navbar-brand" href="index.html">Portal do Aluno SENAI</a>
    </nav>

    <section class="contato-banner">
        <h1>Entre em Contato</h1>
        <p>Estamos prontos para ajudar você.</p>
    </section>

    <main class="contato-container">
        <div class="info-contato">
            <h2>Informações</h2>
            <p><strong>📍 Endereço:</strong><br>Rua Exemplo, 123 - Centro</p>
            <p><strong>📞 Telefone:</strong><br>(11) 4002-8922</p>
            <p><strong>✉️ E-mail:</strong><br>contato@senai.com.br</p>
            <p><strong>🕒 Horário:</strong><br>Segunda a Sexta - 08h às 18h</p>
        </div>

        <div class="formulario">
            <h2>Envie sua mensagem</h2>
            <form>
                <div class="mb-3">
                    <label class="form-label">Nome</label>
                    <input type="text" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">E-mail</label>
                    <input type="email" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Assunto</label>
                    <input type="text" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Mensagem</label>
                    <textarea class="form-control" rows="5" required></textarea>
                </div>
                <button type="submit" class="btn-enviar">Enviar Mensagem</button>
            </form>
        </div>
    </main>

    <footer>
        Portal do Aluno SENAI © 2026
    </footer>

    <script>
        let tamanhoFonte = 16;

        // Aumentar fonte
        document.getElementById("aumentar").addEventListener("click", function(){
            if(tamanhoFonte < 24){
                tamanhoFonte += 2;
                document.body.style.fontSize = tamanhoFonte + "px";
            }
        });

        // Diminuir fonte
        document.getElementById("diminuir").addEventListener("click", function(){
            if(tamanhoFonte > 12){
                tamanhoFonte -= 2;
                document.body.style.fontSize = tamanhoFonte + "px";
            }
        });

        // Alto contraste
        document.getElementById("contraste").addEventListener("click", function(){
            document.body.classList.toggle("alto-contraste");

            if(document.body.classList.contains("alto-contraste")){
                this.innerHTML = "🌙";
            } else {
                this.innerHTML = "☀️";
            }
        });
    </script>
</body>
</html>
